name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Package
        run: mvn -B -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: SupplySign
          path: target/SupplySign-*.jar
